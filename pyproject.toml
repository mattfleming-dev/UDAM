[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-stock-dam"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "SQLAlchemy>=2.0",
    "rawpy>=0.25",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.scripts]
universal-stock-dam = "universal_stock_dam.main:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_stock_dam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
